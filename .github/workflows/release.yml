name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check the tag matches the version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match the version in package.json, $version"
            exit 1
          fi
          echo "VSIX=markdown-toc-sidebar-$version.vsix" >> "$GITHUB_ENV"
      - name: Package extension
        run: npx @vscode/vsce package --out "$VSIX"
      - name: Attach to the GitHub release
        # Uploads to the release if it already exists, otherwise creates a draft to write the notes in.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$VSIX" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$VSIX" --draft --verify-tag --title "$GITHUB_REF_NAME" --notes ""
          fi
